name: Provider capability report
description: Correct or confirm what InstalmentFlow documents about M-Pesa, Airtel Money or another provider.
labels: [provider, docs]
body:
  - type: dropdown
    id: provider
    attributes: { label: Provider, options: [M-Pesa (Daraja), Airtel Money, Other] }
    validations: { required: true }
  - type: textarea
    id: claim
    attributes: { label: Documented claim (link to the docs section) }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to official provider documentation, or a redacted sandbox/production payload. Never include credentials.
    validations: { required: true }
