name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CI: true

jobs:
  build-test:
    name: ${{ matrix.os }} / .NET ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: ['10.0', '11.0']   # packages target net10.0; the 11.0 leg runs the same build on the .NET 11 runtime
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # MinVer derives versions from tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.runtime == '11.0' && '11.0.x' || '' }}

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dotnet test --no-build -c Release
          else
            # Windows runners cannot run Linux containers: the PostgreSQL store's tests run on the Linux legs.
            dotnet test --no-build -c Release --project tests/InstalmentFlow.Tests
            dotnet test --no-build -c Release --project tests/InstalmentFlow.Payments.Tests
            dotnet test --no-build -c Release --project tests/InstalmentFlow.Payments.Mpesa.Tests
            dotnet test --no-build -c Release --project tests/InstalmentFlow.Payments.AirtelMoney.Tests
            dotnet test --no-build -c Release --project tests/InstalmentFlow.AspNetCore.Tests
            dotnet test --no-build -c Release --project tests/InstalmentFlow.ArchitectureTests
          fi
        env:
          DOTNET_ROLL_FORWARD: ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}

      - name: Core and payments suites against PostgreSQL
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet test --no-build -c Release --project tests/InstalmentFlow.Tests
          dotnet test --no-build -c Release --project tests/InstalmentFlow.Payments.Tests
        env:
          IF_STORE: postgres
          DOTNET_ROLL_FORWARD: ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}

      - name: Sample 07 against PostgreSQL
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker run -d --name sample-pg -e POSTGRES_PASSWORD=sample -p 5433:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec sample-pg pg_isready -U postgres && break; sleep 1; done
          sleep 2
          dotnet run --project samples/07-ExistingLoanSystem --no-build -c Release
        env:
          INSTALMENTFLOW_SAMPLE_PG: Host=localhost;Port=5433;Username=postgres;Password=sample
          DOTNET_ROLL_FORWARD: ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}

      - name: Run samples
        shell: bash
        run: |
          for sample in samples/*/; do
            [ -f "$sample"/*.csproj ] || continue
            echo "::group::$sample"
            dotnet run --project "$sample" --no-build -c Release
            echo "::endgroup::"
          done
        env:
          DOTNET_ROLL_FORWARD: ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}

      - name: Random histories (10^5, I-10)
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0'
        run: dotnet test --no-build -c Release --project tests/InstalmentFlow.Tests -- --filter-method "*Property_random_histories*"
        env:
          IF_HISTORIES: 100000

      - name: Pack
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0'
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0'
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget            # requires approval; holds the NUGET_USER secret (nuget.org profile name)
    permissions:
      contents: write             # create the GitHub Release
      id-token: write             # Trusted Publishing: exchange the workflow's OIDC token for a short-lived key
    steps:
      - uses: actions/checkout@v7   # for CHANGELOG.md

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: GitHub Release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release notes are the tag's CHANGELOG section.
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { if (found) exit } found' CHANGELOG.md > notes.md
          prerelease=$([[ "$version" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --verify-tag --title "$version" --notes-file notes.md $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
