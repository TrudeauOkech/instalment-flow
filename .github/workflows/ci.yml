name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CI: true

jobs:
  build-test:
    name: ${{ matrix.os }} / .NET ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: ['10.0', '11.0']   # packages target net10.0; the 11.0 leg runs the same build on the .NET 11 runtime
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # MinVer derives versions from tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.runtime == '11.0' && '11.0.x' || '' }}

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
        env:
          DOTNET_ROLL_FORWARD: ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}

      - name: Pack
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0'
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0'
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error
